# ==============================================================================
# Render Blueprint Specification for PulseBridge
# Free Tier Static Site with Instant Global CDN and SPA Routing
# ==============================================================================

services:
  - type: static
    name: pulse-bridge
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
