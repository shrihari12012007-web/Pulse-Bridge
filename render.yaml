# ==============================================================================
# Render.com Blueprint Specification for PulseBridge
# Hackathon: BUILDATHON 2.0 (Problem H4: Emergency Health Assistance)
# ==============================================================================

services:
  # Option 1: Render Static Site (Recommended for Free Tier / Zero Idle Sleep)
  - type: web
    name: pulsebridge-static
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # Option 2: Render Web Service (Node.js Server)
  - type: web
    name: pulsebridge-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
